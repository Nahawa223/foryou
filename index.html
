<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques & Espace Privé</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', monospace;
        }

        body {
            background: #0d0614;
            background: radial-gradient(circle, #250b3a 0%, #08020f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        /* --- STATISTIQUES --- */
        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .stat {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid cyan;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 150px;
            box-shadow: 0 0 20px #00ffff55;
        }

        .stat h2 {
            font-size: 2rem;
            color: cyan;
        }

        /* --- ESPACE PRIVÉ --- */
        .private {
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .private h2 {
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(90deg, #ff4081, #b83280);
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        input {
            padding: 12px;
            border-radius: 20px;
            border: none;
            margin: 10px 0;
            color: #000;
            font-weight: bold;
            text-align: center;
            width: 80%;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #dashboard {
            margin-top: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
        }

        #dashboard p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <!-- STATISTIQUES -->
    <section class="stats">
        <div class="stat">
            <h2 id="visiteurs">0</h2>
            <p>👁 Visiteurs</p>
        </div>
        <div class="stat">
            <h2 id="projets">0</h2>
            <p>🚀 Projets</p>
        </div>
        <div class="stat">
            <h2 id="clients">0</h2>
            <p>⭐ Clients</p>
        </div>
    </section>

    <!-- ESPACE PRIVÉ -->
    <section class="private">
        <h2>🔐 Espace privé</h2>
        <button id="btn-connexion" class="btn" onclick="ouvrirConnexion()">Connexion</button>

        <div id="login" style="display:none;">
            <input id="mdp" type="password" placeholder="Mot de passe">
            <button class="btn" onclick="connexion()">Entrer</button>
        </div>

        <div id="dashboard" style="display:none;">
            <h3>🚀 Tableau de bord</h3>
            <p>Bienvenue dans ton espace administrateur.</p>
            <p>📈 Statut : Actif</p>
            <p>💎 Compte Premium</p>
        </div>
    </section>

    <script>
        // --- COMPTEURS ANIMÉS ---
        function compteur(id, nombre) {
            let element = document.getElementById(id);
            let i = 0;
            let timer = setInterval(() => {
                i++;
                element.innerHTML = i;
                if (i >= nombre) {
                    clearInterval(timer);
                }
            }, 20);
        }

        compteur("visiteurs", 1250);
        compteur("projets", 48);
        compteur("clients", 96);

        // --- ESPACE PRIVÉ ---
        function ouvrirConnexion() {
            document.getElementById("login").style.display = "block";
            document.getElementById("btn-connexion").style.display = "none";
        }

        function connexion() {
            let mot = document.getElementById("mdp").value;
            if (mot === "1234") {
                document.getElementById("dashboard").style.display = "block";
                document.getElementById("login").style.display = "none";
            } else {
                alert("Mot de passe incorrect");
            }
        }
    </script>

</body>
</html>
